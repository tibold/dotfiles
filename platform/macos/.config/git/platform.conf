# macOS-only git settings.
#
# Linked to ~/.config/git/platform.conf by the links step, which mirrors
# platform/<name>/ into $HOME only on a machine <name> matches. ~/.gitconfig
# includes this path unconditionally; git ignores an include whose file is not
# there, so on every other system this simply does not exist and nothing has to
# know that.
#
# It is included last, so anything here overrides the same setting above it.

# Where git-credential-manager keeps the credentials it stores.
#
# ~/.gitconfig asks for "plaintext", which is the honest answer on a headless
# Linux box: there is no secret service to talk to, and GCM refuses to guess.
# It writes the credentials unencrypted to ~/.gcm/store.
#
# macOS has the Keychain, which is GCM's own default here and which this
# restores. The setting is scoped to the same host as the helper it belongs to.
[credential "https://dev.azure.com"]
	credentialStore = keychain
