# Windows only. See platform/macos/.config/git/platform.conf for why this file
# exists at all.
#
# Git Credential Manager on Windows keeps secrets in the Windows Credential
# Manager, which is the honest answer here -- the plaintext store
# home/.gitconfig asks for is for headless Linux boxes with nothing better.
#
# GCM's name for that store is `wincredman`. `wincred` is git's old built-in
# helper of the same idea, and GCM rejects it as an unknown store.
[credential "https://dev.azure.com"]
	credentialStore = wincredman

# Paths past Windows' 260-character MAX_PATH, which deep node_modules and .NET
# build trees reach easily. Git for Windows refuses them without this; the
# setting means nothing to git anywhere else, so it lives here.
[core]
	longpaths = true
