# ArchPillar cyberpunk, for oh-my-posh. The layout is powerlevel10k_rainbow's;
# every colour is a token from the ArchPillar design system, the same ones
# home/.config/tmux/themes/archpillar-cyberpunk.conf names, so the prompt, the
# psmux status line and Rio match. tests/unit/configs.nu fails on any colour
# that is not in that theme (or --danger / --warning).
#
# TOML rather than JSON so each colour can say where it came from.

console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    leading_diamond = '╭─'
    template = ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    foreground = '#E8E9F4' # --fg-1
    background = '#12131C' # --surface-2
    type = 'os'
    style = 'diamond'

  [[blocks.segments]]
    template = '  {{ .Path }} '
    foreground = '#05060A' # --accent-fg
    powerline_symbol = ''
    background = '#22F5A8' # --accent
    type = 'path'
    style = 'powerline'

    [blocks.segments.options]
      home_icon = '~'
      style = 'full'

  [[blocks.segments]]
    template = ' {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    foreground = '#05060A' # --fg-on-accent
    powerline_symbol = ''
    background = '#00E5FF' # --accent-2 (clean)
    type = 'git'
    style = 'powerline'
    # Dirty, diverged, ahead and behind all read as one "pay attention" state
    # here, so they all take the same --warning token rather than four shades
    # of it.
    background_templates = [
      '{{ if or (.Working.Changed) (.Staging.Changed) }}#FFB400{{ end }}', # --warning (dirty)
      '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#FFB400{{ end }}', # --warning (diverged)
      '{{ if gt .Ahead 0 }}#FFB400{{ end }}', # --warning (ahead)
      '{{ if gt .Behind 0 }}#FFB400{{ end }}', # --warning (behind)
    ]

    [blocks.segments.options]
      branch_icon = ' '
      fetch_status = true
      fetch_upstream_icon = true

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = ' {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'node'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'go'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'julia'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'python'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.options]
      display_mode = 'files'
      fetch_virtual_env = false

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'ruby'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.options]
      display_mode = 'files'
      fetch_version = true

  [[blocks.segments]]
    template = ' {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }} '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'azfunc'
    style = 'powerline'
    invert_powerline = true

    [blocks.segments.options]
      display_mode = 'files'
      fetch_version = false

  [[blocks.segments]]
    template = ' {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    type = 'aws'
    style = 'powerline'
    # Upstream picks the background by profile name; both branches collapse to
    # the same token here, so the segment still reads as "aws", not as one
    # more colour to memorise per profile.
    background_templates = [
      '{{if contains "default" .Profile}}#12131C{{end}}', # --surface-2
      '{{if contains "jan" .Profile}}#12131C{{end}}', # --surface-2
    ]
    invert_powerline = true

    [blocks.segments.options]
      display_default = false

  [[blocks.segments]]
    template = '  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'root'
    style = 'powerline'
    invert_powerline = true

  [[blocks.segments]]
    template = ' {{ .FormattedMs }}  '
    foreground = '#E8E9F4' # --fg-1
    powerline_symbol = ''
    background = '#12131C' # --surface-2
    type = 'executiontime'
    style = 'powerline'
    invert_powerline = true

  [[blocks.segments]]
    template = ' {{ if gt .Code 0 }}{{ reason .Code }}{{ else }}{{ end }} '
    foreground = '#E8E9F4' # --fg-1 (ok)
    powerline_symbol = ''
    background = '#12131C' # --surface-2 (ok)
    type = 'status'
    style = 'powerline'
    background_templates = ['{{ if gt .Code 0 }}#FF3B57{{ end }}'] # --danger
    # Dark text on the bright --danger background reads better than --fg-1 --
    # the same fg-on-accent pairing every saturated segment above uses.
    foreground_templates = ['{{ if gt .Code 0 }}#05060A{{ end }}'] # --fg-on-accent
    invert_powerline = true

    [blocks.segments.options]
      always_enabled = true

  [[blocks.segments]]
    trailing_diamond = '─╮'
    template = ' {{ .CurrentDate | date .Format }}  '
    foreground = '#05060A' # --fg-on-accent
    background = '#B14AED' # --accent-3
    type = 'time'
    style = 'diamond'
    invert_powerline = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '╰─'
    foreground = '#9094A8' # --fg-2
    type = 'text'
    style = 'plain'

[[blocks]]
  type = 'rprompt'

  [[blocks.segments]]
    template = '─╯'
    foreground = '#9094A8' # --fg-2
    type = 'text'
    style = 'plain'
