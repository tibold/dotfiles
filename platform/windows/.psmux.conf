# psmux, tmux's Windows stand-in. It reads ~/.psmux.conf before ~/.tmux.conf.
#
# This mirrors home/.tmux.conf on purpose: change a binding in one, change it in
# the other. Left out here, because each shells out to POSIX tools psmux has no
# use for: the terminfo if-shell, the clipboard if-shells, the cpu/mem/swap
# status segment (tmux-status is a shell script), and the zsh default-shell --
# psmux starts pwsh by default.
#
# One deliberate difference from home/.tmux.conf, which sets no escape-time at
# all: the `set -sg escape-time 10` below, carried over from this machine's
# previous ~/.tmux.conf. psmux on Windows needs the lone-Escape forwarded
# immediately for nvim's Escape/Backspace to feel right; not backported to
# home/.tmux.conf, since that would change behaviour on Linux, which nothing
# here asked for.
#
# Colours come from the same theme file tmux reads, linked by steps/appdirs.nu.
# Plain path, no -q and no quotes: psmux mis-parses `source-file -q "..."`.
source-file ~/.config/tmux/themes/archpillar-cyberpunk.conf

set -g mouse on
set -g set-clipboard on

# Scrollback per pane. Inside tmux the terminal's own scrollback is never
# used -- scrolling back reads this buffer -- and tmux's default keeps only
# 2000 lines. The cost is per pane, so this stops well short of Rio's 100000.
set -g history-limit 50000
set-option -g focus-events on
bind-key X kill-session

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Forward a lone Escape immediately instead of holding it for 500ms
# to see whether it starts an escape sequence.
set -sg escape-time 10

# --- status line --------------------------------------------------------------
#
# Drawn by tmux itself, mirroring home/.tmux.conf's status line minus the one
# segment (#(~/.local/bin/tmux-status ...)) that shells out to a POSIX script.

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#{@bg},fg=#{@fg}"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[bg=#{@session_bg},fg=#{@session_fg},bold]  #S #[bg=#{@bg},fg=#{@session_bg}]"

# #F is the window flags: * current, - last, Z zoomed, ! activity. Losing those
# is most of what makes a hand-rolled status bar feel bare.
setw -g window-status-format         "#[fg=#{@fg}] #I #W#F "
setw -g window-status-current-format "#[bg=#{@bg},fg=#{@window_bg}]#[bg=#{@window_bg},fg=#{@window_fg},bold] #I #W#F #[bg=#{@bg},fg=#{@window_bg}]"
setw -g window-status-separator ""

# --warning and --danger from the design system.
setw -g window-status-activity-style "fg=#FFB400,bold"
setw -g window-status-bell-style "fg=#FF3B57,bold"

set -g pane-border-style "fg=#{@rule}"
set -g pane-active-border-style "fg=#{@rule_active}"
set -g message-style "bg=#{@session_bg},fg=#{@session_fg},bold"

set -g status-right "#[fg=#{@host_bg}]#[bg=#{@host_bg},fg=#{@host_fg}]  #h #[bg=#{@host_bg},fg=#{@clock_bg}]#[bg=#{@clock_bg},fg=#{@clock_fg},bold]  %a %d %b %H:%M "
