# vim: ft=gitconfig
# Git settings shared by every machine. Not read directly: the gitconfig step
# (steps/gitconfig.nu) puts an include for this file, and then for
# platform.conf beside it, at the top of ~/.gitconfig. That file itself belongs
# to the machine, so whatever tools write there with `git config --global`
# stays out of this repo and overrides what is here.

[user]
	name = Tibold Kandrai
	email = 1974659+tibold@users.noreply.github.com

# Diffs through delta, matching the pager the lazygit config already uses
# (config/lazygit/config.yml). The package is git-delta; the binary is delta.
[core]
	pager = delta

# Colour only: "git add -p" shows the filtered hunks but applies the answers to
# the original diff, so it needs one output line per input line and stops with
# "mismatched output from interactive.diffFilter" otherwise. --color-only keeps
# delta to syntax highlighting, with no headers or line-number columns.
[interactive]
	diffFilter = delta --color-only

[delta]
	dark = true
	line-numbers = true
	# n and N move between files and hunks rather than scrolling by page.
	navigate = true

# zdiff3 writes the common ancestor into a conflict alongside both sides, so a
# conflict shows what the change was made against rather than only the two
# results. Delta renders that third section; the default "merge" style gives it
# nothing to render.
#
# This changes the markers written into conflicted files, so it is a working
# change rather than only a display one.
[merge]
	conflictStyle = zdiff3

# Rebase on pull rather than merge, so pulling a branch that has moved does not
# manufacture a merge commit for work that was only ever local.
[pull]
	rebase = true

# Stash and restore a dirty tree around the rebase, so pulling does not have to
# wait for uncommitted work to reach a committable state. The stash is reapplied
# afterwards, and stays in the stash list if reapplying conflicts.
[rebase]
	autoStash = true

# Drop remote-tracking branches whose branch is gone on the remote. PR branches
# are deleted when they merge, and without this every one of them lingers as
# origin/<name> in lazygit and in branch completion until pruned by hand.
[fetch]
	prune = true

# Git Credential Manager. `manager`, not `git-credential-manager`: git turns a
# bare helper name into `git credential-<name>`, so the executable's own name
# would ask for git-credential-git-credential-manager and fail at the first
# push. The empty helper first clears any helper inherited from the system
# config, so this is the only one asked.
[credential "https://dev.azure.com"]
	helper =
	helper = manager
	credentialStore = plaintext
	useHttpPath = true
[credential "https://github.com"]
	helper =
	helper = !gh auth git-credential
[credential "https://gist.github.com"]
	helper =
	helper = !gh auth git-credential
