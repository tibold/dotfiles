# ArchPillar cyberpunk -- pitch black, electric mint and cyan. Terminal-native.
# Values are the design system's own, from colors_and_type.css.
set -g @bg          "#05060A"   # --surface-0
set -g @fg          "#9094A8"   # --fg-2
set -g @rule        "#1A1C28"   # --neutral-600
set -g @rule_active "#22F5A8"   # --accent

set -g @session_bg  "#22F5A8"   # --accent (electric mint)
set -g @session_fg  "#05060A"   # --accent-fg
set -g @window_bg   "#00E5FF"   # --accent-2 (cyan)
set -g @window_fg   "#05060A"   # --fg-on-accent
set -g @metrics_bg  "#12131C"   # --surface-2
set -g @metrics_fg  "#9094A8"   # --fg-2
set -g @host_bg     "#262838"   # --neutral-500
set -g @host_fg     "#E8E9F4"   # --fg-1
set -g @clock_bg    "#B14AED"   # --accent-3 (violet)
set -g @clock_fg    "#05060A"   # --fg-on-accent
