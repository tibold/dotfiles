# ArchPillar modern -- pure neutrals, single blue accent. The default theme's
# palette, on its dark neutrals (a status bar sits on a dark terminal).
set -g @bg          "#18181B"   # --neutral-900
set -g @fg          "#A1A1AA"   # --neutral-400
set -g @rule        "#27272A"   # --neutral-800
set -g @rule_active "#2B6CFF"   # --accent

set -g @session_bg  "#2B6CFF"   # --accent
set -g @session_fg  "#FFFFFF"   # --accent-fg
set -g @window_bg   "#FAFAFA"   # --neutral-50
set -g @window_fg   "#18181B"   # --neutral-900
set -g @metrics_bg  "#27272A"   # --neutral-800
set -g @metrics_fg  "#A1A1AA"   # --neutral-400
set -g @host_bg     "#3F3F46"   # --neutral-700
set -g @host_fg     "#E4E4E7"   # --neutral-200
set -g @clock_bg    "#27272A"   # --neutral-800
set -g @clock_fg    "#E4E4E7"   # --neutral-200
