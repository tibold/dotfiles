# tmux-256color describes what tmux actually is -- the screen-* entries predate
# true colour and italics -- but it is not in the terminfo every distribution
# installs by default. openSUSE ships terminfo-base and terminfo-screen, and
# puts tmux-256color in the full "terminfo" package; Fedora and Debian put it
# in ncurses-term.
#
# Naming an entry that is not installed does not fail quietly: every login
# shell inside tmux runs tset and stops to ask
#
#   tset: unknown terminal type tmux-256color
#   Terminal type?
#
# So ask terminfo what it actually has. steps/packages.nu installs the fuller
# database, which makes the first branch the normal one; this is what keeps
# tmux usable on a machine where it could not be installed.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

set -ga terminal-overrides ",*256col*:Tc"

set -g mouse on
set -g set-clipboard on
set-option -g focus-events on
bind-key X kill-session

# Copy to whichever system clipboard this machine actually has.
#
# This used to be wl-copy unconditionally, which silently copies nowhere on X11
# and on the servers and containers this config now also lands on.
if-shell 'command -v wl-copy'  'set -s copy-command "wl-copy"'
if-shell 'command -v xclip'    'set -s copy-command "xclip -selection clipboard -in"'

# --- status line --------------------------------------------------------------
#
# Drawn by tmux itself. It used to be powerline's, which meant a python daemon
# running just to render a status bar and a noticeable pause on every tmux
# start. Native formats cost nothing and live in one place.
#
# Colours are palette numbers, not #rrggbb. Hex needs true colour, which needs
# the outer terminal to advertise it, tmux to be told, and both to survive
# whatever the connection is -- an ssh hop or a container loses it, and the
# theme then degrades to approximations with too little contrast to read. The
# 256-colour palette is the same everywhere.

# Announce true colour anyway, for the things that genuinely want it: vim,
# delta, bat. The status line below does not depend on it.
set -ga terminal-overrides ",*256col*:Tc"
set -sa terminal-features ",*256col*:RGB"

# --- palette ---
#
# Colours come from the ArchPillar design system (its colors_and_type.css),
# not from anything invented here. Each theme in ~/.config/tmux/themes/ is that
# system's tokens for one of its three themes, named in comments so a change
# there can be traced back.
#
# The values are the design system's exact hex. tmux approximates them itself
# on a terminal without true colour, which is a better trade than approximating
# for everyone: xterm's 24 greys are strictly neutral, so pre-converting flattens
# every blue-tinted neutral in this palette to plain grey.
#
# To look at another one without committing to it:
#
#   tmux-theme                       list them
#   tmux-theme archpillar-modern     apply it to the running server, right now
#
# To keep one, change the name on the line below.
source-file -q "~/.config/tmux/themes/archpillar-cyberpunk.conf"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#{@bg},fg=#{@fg}"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[bg=#{@session_bg},fg=#{@session_fg},bold]  #S #[bg=#{@bg},fg=#{@session_bg}]"

# cpu is load over core count, not a percentage: load alone says nothing
# without knowing what it is divided by. See home/.local/bin/tmux-status.
set -g status-right "#[fg=#{@metrics_bg}]#[bg=#{@metrics_bg},fg=#{@metrics_fg}] cpu #(~/.local/bin/tmux-status cpu)  mem #(~/.local/bin/tmux-status mem)  swp #(~/.local/bin/tmux-status swap) #[bg=#{@metrics_bg},fg=#{@host_bg}]#[bg=#{@host_bg},fg=#{@host_fg}]  #h #[bg=#{@host_bg},fg=#{@clock_bg}]#[bg=#{@clock_bg},fg=#{@clock_fg},bold]  %a %d %b %H:%M "

# #F is the window flags: * current, - last, Z zoomed, ! activity. Losing those
# is most of what makes a hand-rolled status bar feel bare.
setw -g window-status-format         "#[fg=#{@fg}] #I #W#F "
setw -g window-status-current-format "#[bg=#{@bg},fg=#{@window_bg}]#[bg=#{@window_bg},fg=#{@window_fg},bold] #I #W#F #[bg=#{@bg},fg=#{@window_bg}]"
setw -g window-status-separator ""

# --warning and --danger from the design system.
setw -g window-status-activity-style "fg=#FFB400,bold"
setw -g window-status-bell-style "fg=#FF3B57,bold"

set -g pane-border-style "fg=#{@rule}"
set -g pane-active-border-style "fg=#{@rule_active}"
set -g message-style "bg=#{@session_bg},fg=#{@session_fg},bold"

# Match the shell.
#
# tmux otherwise takes the shell from the passwd entry, which is only correct
# once steps/zsh.nu has run chsh. This covers the gap -- a machine where chsh
# could not run, or a tmux server started before the install finished, which
# would otherwise keep bash for the life of the server.
#
# Resolved with command -v rather than hardcoded: /usr/bin/zsh on these
# distributions today, but that is not a promise worth baking in.
if-shell 'command -v zsh >/dev/null 2>&1' \
  'run-shell "tmux set-option -g default-shell $(command -v zsh)"'
